<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>경현의 그린플레이</title>
  <link rel="stylesheet" href="style.css">
  <script src="game.js" defer></script>
</head>
<body>
  <main class="club">
    <header class="header">
      <h1>경현의 <em>그린플레이</em></h1>
    </header>
    <section class="game-layout" aria-label="퍼팅 게임">
      <div class="course-wrap">
        <canvas id="course" width="900" height="640" aria-label="골프 그린. 그린을 클릭하거나 아래 방향 슬라이더로 조준하세요.">이 게임은 Canvas를 지원하는 브라우저가 필요합니다.</canvas>
        <div class="course-bottom"><span><i></i> 그린을 눌러 방향 조절</span></div>
        <div id="success" class="success" hidden><div class="success-card"><span class="success-icon">⚑</span><p class="eyebrow">NICELY DONE!</p><h2 id="successTitle">홀인!</h2><p id="successText"></p><button id="playAgain" class="primary">한 번 더 플레이 <span>↗</span></button></div></div>
      </div>
      <aside class="panel">
        <div class="scoreboard"><div><span>현재 타수</span><strong id="strokes">00</strong></div><div><span>홀까지 거리</span><strong><b id="distance">0.0</b><small> m</small></strong></div></div>
        <div class="control"><label for="direction">퍼팅 방향 <output id="directionValue" for="direction">0°</output></label><input id="direction" type="range" min="-180" max="180" value="-42" step="1"><div class="range-labels"><span>← 왼쪽</span><span>오른쪽 →</span></div></div>
        <div class="control power-control"><label for="power">파워 <output id="powerValue" for="power">55<span>%</span></output></label><input id="power" type="range" min="5" max="100" value="55"><div class="range-labels"><span>SOFT</span><span>STRONG</span></div></div>
        <button id="putt" class="primary">PUTT <span>↗</span></button>
        <button id="reset" class="reset">↻ &nbsp; RESET <span>처음부터 다시</span></button>
        <p id="status" class="status" role="status" aria-live="polite">첫 퍼팅을 준비해 주세요.</p>
      </aside>
    </section>
  </main>
</body>
</html>
